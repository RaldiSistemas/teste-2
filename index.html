<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Raldi Mapa — Layout da Fábrica</title>
<meta name="theme-color" content="#982424">
<link rel="icon" type="image/png" href="https://i.postimg.cc/9MsBrnJd/app-icone.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/9MsBrnJd/app-icone.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --vm:#982424; --vm2:#7f1e1e; --tx:#4B4B55; --mut:#7c7c86;
    --content:#ecece6; --sf:#fff; --ln:rgba(75,75,85,.14); --rail:#232428;
    --st-vazio:#b9b7ae; --st-nao:#8d8b83; --st-and:#d4930d; --st-pau:#7a6ea8; --st-fim:#2f8f46;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:'Archivo',system-ui,-apple-system,sans-serif; color:var(--tx); background:var(--content);
    -webkit-font-smoothing:antialiased; font-size:15px; height:100dvh; overflow:hidden; }
  button,input,select{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--vm); outline-offset:2px; }
  .tela{ position:fixed; inset:0; display:none; flex-direction:column; }
  .tela.on{ display:flex; }

  /* ===== Login ===== */
  #login{ background:linear-gradient(165deg,#2c2d32 0%,#1a1b1e 100%); align-items:center; justify-content:center;
    padding:calc(28px + var(--sat)) 22px calc(28px + var(--sab)); }
  .lg{ width:min(380px,100%); text-align:center; }
  .lg-ic{ width:76px; height:76px; border-radius:20px; margin:0 auto 18px; display:block; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .lg-t{ font-family:'Poppins',sans-serif; font-size:25px; font-weight:600; color:#fff; }
  .lg-s{ font-size:10px; font-weight:800; letter-spacing:.34em; text-transform:uppercase; color:var(--vm); margin-top:8px; }
  .lg-form{ margin-top:32px; text-align:left; }
  .lg-f{ margin-bottom:14px; }
  .lg-f label{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
    color:rgba(255,255,255,.42); margin-bottom:7px; }
  .lg-f input{ width:100%; font-size:17px; padding:16px; border:1.5px solid rgba(255,255,255,.14);
    border-radius:14px; background:rgba(255,255,255,.06); color:#fff; }
  .lg-f input::placeholder{ color:rgba(255,255,255,.26); }
  .lg-f input:focus{ outline:0; border-color:var(--vm); background:rgba(255,255,255,.1); }
  .lg-e{ font-size:13px; font-weight:600; color:#e57373; min-height:19px; margin-bottom:6px; }
  .lg-b{ width:100%; font-size:17px; font-weight:700; padding:17px; border:0; border-radius:14px;
    background:var(--vm); color:#fff; box-shadow:0 8px 22px rgba(152,36,36,.4); cursor:pointer; }
  .lg-b:disabled{ opacity:.45; box-shadow:none; }
  .lg-d{ font-size:12px; line-height:1.55; margin-top:20px; padding:12px 14px; border-radius:11px; text-align:left; }
  .lg-d:empty{ display:none; }
  .lg-d.ok{ background:rgba(255,255,255,.05); color:rgba(255,255,255,.4); text-align:center; }
  .lg-d.err{ background:rgba(152,36,36,.18); border:1px solid rgba(152,36,36,.4); color:#f0a6a6; }

  /* ===== Topo ===== */
  .topo{ background:var(--rail); color:#fff; padding:calc(10px + var(--sat)) 16px 10px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex:0 0 auto; }
  .tp-marca{ display:flex; align-items:center; gap:10px; }
  .tp-marca img{ width:32px; height:32px; border-radius:9px; }
  .tp-t{ font-family:'Poppins',sans-serif; font-size:15.5px; font-weight:600; line-height:1.1; }
  .tp-s{ font-size:9.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.36); }
  .tp-sep{ width:1px; height:26px; background:rgba(255,255,255,.14); }
  .tp-g{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sel{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#fff;
    border-radius:9px; padding:8px 10px; font-size:13.5px; font-weight:600; max-width:250px; }
  .sel option{ background:#232428; color:#fff; }
  .sel:focus{ outline:0; border-color:var(--vm); }
  .tp-dir{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .bt{ border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); color:#fff;
    border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .bt:hover{ background:rgba(255,255,255,.13); }
  .bt.on{ background:#d4930d; border-color:#d4930d; color:#231d09; }

  /* ===== Corpo ===== */
  .corpo{ flex:1; position:relative; overflow:hidden; display:flex; min-height:0; }
  .canvas{ flex:1; position:relative; overflow:hidden; background:var(--content);
    background-image:linear-gradient(rgba(75,75,85,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(75,75,85,.05) 1px,transparent 1px);
    background-size:28px 28px; touch-action:none; cursor:grab; }
  .canvas.escuro{ background:#14151a;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px); }
  .canvas.arrastando{ cursor:grabbing; }
  .canvas.editando{ cursor:crosshair; }
  .stage{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .planta{ display:block; color:#5a5b66; }
  .canvas.escuro .planta{ color:#e0483f; }
  .planta path{ fill:currentColor; stroke:currentColor; stroke-width:.55; }
  .pins{ position:absolute; inset:0; }

  /* ===== Pino ===== */
  .pin{ position:absolute; transform:translate(-50%,-50%) scale(var(--inv,1)); transform-origin:center;
    width:34px; height:34px; cursor:pointer; }
  .pin svg{ position:absolute; inset:0; width:34px; height:34px; overflow:visible; }
  .pin .anel{ fill:none; stroke:rgba(0,0,0,.16); stroke-width:3.5; }
  .canvas.escuro .pin .anel{ stroke:rgba(255,255,255,.2); }
  .pin .prog{ fill:none; stroke:#2f8f46; stroke-width:3.5; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:17px 17px; }
  .pin .bola{ stroke:#fff; stroke-width:2.5; }
  .canvas.escuro .pin .bola{ stroke:#14151a; }
  .pin.st-vazio .bola{ fill:#f2f0ea; stroke:var(--st-vazio); stroke-width:3; }
  .canvas.escuro .pin.st-vazio .bola{ fill:#3a3b42; stroke:#8e8c85; }
  .pin.st-vazio .qtd::before{ content:'·'; font-size:22px; line-height:0; }
  .pin.st-nao   .bola{ fill:var(--st-nao); }
  .pin.st-and   .bola{ fill:var(--st-and); }
  .pin.st-pau   .bola{ fill:var(--st-pau); }
  .pin.st-fim   .bola{ fill:var(--st-fim); }
  .pin.st-and::after{ content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--st-and); animation:pulso 1.8s ease-out infinite; pointer-events:none; }
  @keyframes pulso{ 0%{ transform:scale(.75); opacity:.85 } 100%{ transform:scale(1.35); opacity:0 } }
  @media (prefers-reduced-motion:reduce){ .pin.st-and::after{ animation:none; opacity:.4 } }
  .pin .qtd{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800; color:#fff; pointer-events:none; }
  .pin.st-vazio .qtd{ color:var(--st-vazio); }
  .pin.st-vazio .rot{ opacity:.75; }
  .pin .rot{ position:absolute; top:38px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:11px; font-weight:700; background:rgba(255,255,255,.93); color:var(--tx);
    padding:2px 7px; border-radius:6px; border:1px solid var(--ln); pointer-events:none; }
  .canvas.escuro .pin .rot{ background:rgba(20,21,26,.92); color:#e8e8e2; border-color:rgba(255,255,255,.18); }
  .pin .selo{ position:absolute; top:-5px; right:-7px; min-width:16px; height:16px; padding:0 4px;
    border-radius:8px; background:var(--st-pau); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:1.5px solid #fff; pointer-events:none; }
  .pin.sel .bola{ stroke:var(--vm); stroke-width:4; }
  .pin.arrastavel{ cursor:move; }

  /* ===== Flutuantes ===== */
  .flut{ position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; gap:10px; z-index:5; }
  .cartao{ background:var(--sf); border:1px solid var(--ln); border-radius:12px; padding:11px 13px;
    box-shadow:0 6px 18px rgba(0,0,0,.1); }
  .lgd{ display:flex; flex-direction:column; gap:6px; }
  .lgd-l{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; }
  .lgd-b{ width:13px; height:13px; border-radius:50%; flex:0 0 auto; border:2px solid #fff; box-shadow:0 0 0 1px var(--ln); }
  .resumo{ display:flex; gap:16px; }
  .rz b{ display:block; font-family:'Poppins',sans-serif; font-size:19px; line-height:1.1; }
  .rz span{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  .zoom{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:5; }
  .zb{ width:38px; height:38px; border-radius:10px; border:1px solid var(--ln); background:var(--sf);
    font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex; align-items:center; justify-content:center; }
  .zb:hover{ background:#f6f5f0; }
  .zb.pq{ font-size:11px; font-weight:800; }
  .aviso{ position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; max-width:min(680px,92%);
    text-align:center; background:#d4930d; color:#231d09; font-size:12.5px; font-weight:700;
    padding:8px 15px; border-radius:9px; box-shadow:0 4px 14px rgba(0,0,0,.16); }
  .dicavazia{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; text-align:center; padding:24px; color:var(--mut); pointer-events:none; z-index:4; }
  .dicavazia b{ font-family:'Poppins',sans-serif; font-size:18px; color:var(--tx); }
  .canvas.escuro .dicavazia b{ color:#e8e8e2; }
  .dicavazia p{ font-size:13.5px; max-width:380px; line-height:1.55; }

  /* ===== Gaveta ===== */
  .gav{ width:min(430px,92vw); flex:0 0 auto; background:var(--sf); border-left:1px solid var(--ln);
    display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,.08); }
  .gav-top{ padding:16px 18px 13px; border-bottom:1px solid var(--ln); }
  .gav-x{ float:right; width:30px; height:30px; border-radius:8px; border:1px solid var(--ln); background:transparent;
    font-size:16px; cursor:pointer; }
  .gav-t{ font-family:'Poppins',sans-serif; font-size:18px; font-weight:600; }
  .gav-sub{ font-size:12.5px; color:var(--mut); margin-top:3px; }
  .gav-c{ flex:1; overflow-y:auto; padding:14px 18px 24px; }
  .chip{ display:inline-flex; align-items:center; font-size:11px; font-weight:800; padding:3px 9px;
    border-radius:20px; color:#fff; }
  .c-nao{ background:var(--st-nao) } .c-and{ background:var(--st-and) }
  .c-pau{ background:var(--st-pau) } .c-fim{ background:var(--st-fim) }
  .c-lote{ background:#2f6fb5 } .c-proj{ background:#5c5c66 }
  .barras{ display:flex; height:8px; border-radius:5px; overflow:hidden; background:#eceae3; margin:2px 0 5px; }
  .barras i{ display:block; height:100%; }
  .op{ border:1px solid var(--ln); border-radius:11px; padding:12px 13px; margin-bottom:10px; background:#fbfbf8; }
  .op-h{ display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
  .op-n{ font-family:'Poppins',sans-serif; font-size:14.5px; font-weight:600; }
  .op-l{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; margin-top:6px; }
  .op-l dt{ color:var(--mut); font-weight:600; }
  .op-l dd{ font-weight:600; }
  .op-p{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--ln); font-size:12px; color:var(--mut); line-height:1.6; }
  .op-p b{ color:var(--tx); }
  .nada{ text-align:center; padding:26px 10px; color:var(--mut); font-size:13.5px; line-height:1.6; }

  /* ===== Modal ===== */
  .fundo{ position:fixed; inset:0; background:rgba(28,29,32,.5); display:none; align-items:center;
    justify-content:center; padding:18px; z-index:60; }
  .fundo.on{ display:flex; }
  .modal{ background:var(--sf); border-radius:16px; width:min(500px,100%); max-height:88vh;
    display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.28); }
  .m-top{ padding:18px 20px 14px; border-bottom:1px solid var(--ln); }
  .m-t{ font-family:'Poppins',sans-serif; font-size:18px; font-weight:600; }
  .m-c{ padding:16px 20px; overflow-y:auto; flex:1; }
  .m-b{ padding:14px 20px; border-top:1px solid var(--ln); display:flex; gap:9px; justify-content:flex-end; }
  .cmp{ margin-bottom:14px; }
  .cmp label{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--mut); margin-bottom:6px; }
  .cmp input,.cmp select{ width:100%; padding:11px 12px; border:1.5px solid var(--ln); border-radius:10px;
    background:#fbfbf8; font-size:14.5px; font-weight:600; }
  .cmp input:focus,.cmp select:focus{ outline:0; border-color:var(--vm); background:#fff; }
  .cmp .dica{ font-size:12px; color:var(--mut); font-weight:500; margin-top:5px; line-height:1.5; }
  .bd{ border:1px solid var(--ln); background:#fbfbf8; border-radius:10px; padding:9px; max-height:170px; overflow-y:auto; }
  .bd label{ display:flex; align-items:center; gap:9px; padding:6px 5px; font-size:13.5px; font-weight:600;
    text-transform:none; letter-spacing:0; color:var(--tx); margin:0; cursor:pointer; border-radius:7px; }
  .bd label:hover{ background:#f0efe9; }
  .bd input{ width:auto; }
  .btl{ border:1px solid var(--ln); background:#fbfbf8; border-radius:10px; padding:11px 14px;
    font-size:14.5px; font-weight:700; cursor:pointer; }
  .btl:hover{ background:#f0efe9; }
  .btl.pri{ background:var(--vm); border-color:var(--vm); color:#fff; }
  .btl.pri:hover{ background:var(--vm2); }
  .btl.per{ color:var(--vm); border-color:rgba(152,36,36,.3); }

  .toast{ position:fixed; left:50%; transform:translateX(-50%) translateY(14px); bottom:calc(22px + var(--sab));
    background:var(--tx); color:#fff; font-size:14px; font-weight:600; padding:13px 20px; border-radius:12px;
    opacity:0; pointer-events:none; transition:opacity .22s,transform .22s; z-index:99; }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .erroFaixa{ position:fixed; left:14px; right:14px; top:calc(var(--sat) + 62px); z-index:98;
    background:#fdeaea; border:1px solid rgba(152,36,36,.35); color:#7f1e1e; border-radius:11px;
    padding:12px 15px; font-size:13px; font-weight:600; line-height:1.6; box-shadow:0 6px 20px rgba(0,0,0,.14); }
  .erroFaixa code{ background:rgba(152,36,36,.1); padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,monospace; font-size:12px; font-weight:600; }
  .off{ position:fixed; top:var(--sat); left:0; right:0; background:var(--vm); color:#fff; font-size:12.5px;
    font-weight:600; text-align:center; padding:7px; z-index:100; display:none; }
  .off.on{ display:block; }

  @media(max-width:860px){
    .gav{ position:absolute; right:0; top:0; bottom:0; z-index:20; }
    .tp-marca .tp-s{ display:none; }
    .flut{ bottom:10px; left:10px; }
    .resumo{ display:none; }
  }
</style>
</head>
<body>

<section class="tela on" id="login">
  <div class="lg">
    <img class="lg-ic" src="https://i.postimg.cc/9MsBrnJd/app-icone.png" alt="Raldi">
    <div class="lg-t">Raldi Mapa</div>
    <div class="lg-s">Layout da fábrica</div>
    <form class="lg-form" id="loginForm" onsubmit="entrar(); return false;">
      <div class="lg-f"><label for="em">E-mail</label>
        <input id="em" name="username" type="email" autocomplete="username" inputmode="email"
          placeholder="seu@email.com" autocapitalize="off" spellcheck="false" required></div>
      <div class="lg-f"><label for="se">Senha</label>
        <input id="se" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <div class="lg-e" id="lgErr"></div>
      <button class="lg-b" id="lgBtn" type="submit">Entrar</button>
    </form>
    <div class="lg-d" id="lgDiag"></div>
  </div>
</section>

<section class="tela" id="app">
  <header class="topo">
    <div class="tp-marca">
      <img src="https://i.postimg.cc/9MsBrnJd/app-icone.png" alt="">
      <div><div class="tp-t">Mapa da Fábrica</div><div class="tp-s">Raldi</div></div>
    </div>
    <div class="tp-sep"></div>
    <div class="tp-g">
      <select class="sel" id="selModo" onchange="setModo(this.value)">
        <option value="projeto">Filtrar por projeto</option>
        <option value="lote">Filtrar por lote</option>
        <option value="tudo">Fábrica inteira</option>
      </select>
      <select class="sel" id="selAlvo" onchange="setAlvo(this.value)"></select>
    </div>
    <div class="tp-dir">
      <button class="bt" onclick="diagnostico()" title="Testar leitura e escrita no banco">Diagnóstico</button>
      <button class="bt" id="btEdit" onclick="alternarEdicao()">Editar pontos</button>
      <button class="bt" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="corpo">
    <div class="canvas" id="canvas">
      <div class="stage" id="stage">

function jhm(s){ const [h,m]=String(s||'0:0').split(':').map(Number); return (h||0)*60+(m||0); }

function jdia(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jover(a1,a2,b1,b2){ return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1)); }

  const ini=new Date(iniISO), fim=new Date(fimISO);

/* ===================== Estado ===================== */
let OPS=[], PAINEL=[], EQUIPE=[], PONTOS={}, FUNDO='escuro';
let modo='projeto', alvo='', editando=false, pontoSel=null, ligado=false;
const Z={k:1,x:0,y:0};
function pontosLista(){ return Object.values(PONTOS||{}).sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }

/* ===================== Projeto → lote ===================== */
// As OPs de Sublinha e Apoio são emitidas uma vez para o lote inteiro e cobrem
// todos os projetos dele — por isso o projeto herda as OPs do seu lote.
function loteDoProjeto(proj){
  proj=String(proj||'').trim(); if(!proj) return '';
  const p=PAINEL.find(r=>String(r.projeto||'').trim()===proj&&String(r.lote||'').trim());
  if(p) return String(p.lote).trim();
  const o=OPS.find(o=>String(o.lote||'').trim()&&(o.projetosLote||[]).some(r=>String(r&&r.projeto||'').trim()===proj));
  return o?String(o.lote).trim():'';
}
function projetosDaOP(o){
  const s=new Set();
  if(o.projeto) s.add(String(o.projeto).trim());
  (o.projetosLote||[]).forEach(r=>{ if(r&&r.projeto) s.add(String(r.projeto).trim()); });
  return [...s];
}
function escopoOP(o){ return (o.tipo==='lote'||projetosDaOP(o).length>1)?'lote':'projeto'; }
function opsFiltradas(){
  if(modo==='tudo') return OPS;
  if(modo==='lote'){
    const l=String(alvo||'').trim(); if(!l) return [];
    return OPS.filter(o=>String(o.lote||'').trim()===l);
  }
  const p=String(alvo||'').trim(); if(!p) return [];
  const lote=loteDoProjeto(p);
  return OPS.filter(o=>projetosDaOP(o).includes(p)||(lote&&o.tipo==='lote'&&String(o.lote||'').trim()===lote));
}

/* ===================== Pontos ===================== */
function opsDoPonto(p,lista){
  return (lista||opsFiltradas()).filter(o=>{
    if(String(o.setor||'')!==String(p.setor||'')) return false;
    if(p.atividade&&String(o.atividade||'')!==String(p.atividade)) return false;
    if(p.funcs&&p.funcs.length){
      const e=equipeOP(o);
      if(!e.length||!e.some(n=>p.funcs.includes(n))) return false;
    }
    return true;
  });
}
function estadoPonto(ops){
  if(!ops.length) return {st:'vazio',frac:0,pausadas:0,total:0,fim:0};
  const c={nao:0,parcial:0,pausada:0,encerrada:0};
  ops.forEach(o=>c[stOp(o)]++);
  let st='nao';
  if(c.parcial) st='and';
  else if(c.pausada) st='pau';
  else if(c.encerrada===ops.length) st='fim';
  else if(c.encerrada) st='and';
  return {st,frac:c.encerrada/ops.length,pausadas:c.pausada,total:ops.length,fim:c.encerrada};
}

/* ===================== Render ===================== */
function render(){
  montarSelectAlvo();
  document.getElementById('canvas').classList.toggle('escuro',FUNDO==='escuro');
  desenharPinos();
  desenharResumo();
  atualizarAviso();
  const dv=document.getElementById('dicavazia');
  if(!pontosLista().length&&!editando){
    dv.style.display='flex';
    dv.innerHTML=`<b>A planta ainda não tem pontos</b>
      <p>Abra "Editar pontos" no topo e clique sobre a planta para marcar onde fica cada posto de trabalho.</p>`;
  }else dv.style.display='none';
  if(pontoSel) abrirGaveta(pontoSel,true);
}
function desenharPinos(){
  const lista=opsFiltradas(), semAlvo=(modo!=='tudo'&&!alvo);
  document.getElementById('pins').innerHTML=pontosLista().map(p=>{
    const ops=semAlvo?[]:opsDoPonto(p,lista);
    const e=estadoPonto(ops);
    const R=13.5, C=2*Math.PI*R;
    const dash=(e.frac>0&&e.st!=='fim')?`${(C*e.frac).toFixed(1)} ${C.toFixed(1)}`:'0 999';
    return `<div class="pin st-${e.st}${pontoSel===p.id?' sel':''}${editando?' arrastavel':''}"
        style="left:${(p.x*100).toFixed(3)}%;top:${(p.y*100).toFixed(3)}%" data-id="${p.id}">
      <svg viewBox="0 0 34 34">
        ${(e.frac>0&&e.st!=='fim')?`<circle class="anel" cx="17" cy="17" r="${R}"></circle>
        <circle class="prog" cx="17" cy="17" r="${R}" stroke-dasharray="${dash}"></circle>`:''}
        <circle class="bola" cx="17" cy="17" r="10"></circle>
      </svg>
      <div class="qtd">${e.total||''}</div>
      ${(e.pausadas&&e.st!=='pau')?`<div class="selo">⏸${e.pausadas}</div>`:''}
      <div class="rot">${esc(p.nome||p.atividade||opSetorDe(p.setor).sigla)}</div>
    </div>`;
  }).join('');
  aplicarZoom(); ligarPinos();
}
function desenharResumo(){
  const lista=(modo!=='tudo'&&!alvo)?[]:opsFiltradas();
  const c={nao:0,parcial:0,pausada:0,encerrada:0};
  lista.forEach(o=>c[stOp(o)]++);
  const tot=lista.length, pct=tot?Math.round(c.encerrada/tot*100):0;
  document.getElementById('resumo').innerHTML=`
    <div class="rz"><b>${pct}%</b><span>Concluído</span></div>
    <div class="rz"><b>${c.parcial}</b><span>Rodando</span></div>
    <div class="rz"><b>${c.pausada}</b><span>Pausadas</span></div>
    <div class="rz"><b>${tot}</b><span>OPs</span></div>`;
}
function montarSelectAlvo(){
  const s=document.getElementById('selAlvo');
  if(document.activeElement===s) return;
  if(modo==='tudo'){ s.style.display='none'; return; }
  s.style.display='';
  const set=new Set();
  if(modo==='projeto'){
    PAINEL.forEach(r=>{ const p=String(r.projeto||'').trim(); if(p) set.add(p); });
    OPS.forEach(o=>projetosDaOP(o).forEach(p=>set.add(p)));
  }else{
    PAINEL.forEach(r=>{ const l=String(r.lote||'').trim(); if(l) set.add(l); });
    OPS.forEach(o=>{ const l=String(o.lote||'').trim(); if(l) set.add(l); });
  }
  const ops=[...set].sort((a,b)=>String(b).localeCompare(String(a),'pt',{numeric:true}));
  if(alvo&&!ops.includes(alvo)) alvo='';
  s.innerHTML=`<option value="">${modo==='projeto'?'Escolha o projeto':'Escolha o lote'}</option>`+
    ops.map(v=>{
      const extra=modo==='projeto'?(()=>{ const l=loteDoProjeto(v); return l?' · lote '+l:' · sem lote'; })():'';
      return `<option value="${esc(v)}"${v===alvo?' selected':''}>${esc(v)}${esc(extra)}</option>`;
    }).join('');
}
function setModo(v){ modo=v; alvo=''; pontoSel=null; fecharGaveta(); render(); }
function setAlvo(v){ alvo=v; render(); }

/* ===================== Zoom e pan ===================== */
const canvas=document.getElementById('canvas'), stage=document.getElementById('stage');
function aplicarZoom(){
  stage.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.k})`;
  document.getElementById('pins').style.setProperty('--inv',(1/Z.k).toFixed(4));
}
function enquadrar(tent){
  const r=canvas.getBoundingClientRect();
  if(!r.width||!r.height){                    // o canvas ainda não tem tamanho: tenta de novo no próximo quadro
    if((tent||0)<20) requestAnimationFrame(()=>enquadrar((tent||0)+1));
    return;
  }
  const k=Math.min(r.width/PLANTA_W,r.height/PLANTA_H)*.92;
  Z.k=Math.max(k,.05); Z.x=(r.width-PLANTA_W*Z.k)/2; Z.y=(r.height-PLANTA_H*Z.k)/2; aplicarZoom();
}
function zoomEm(f,cx,cy){
  const nk=Math.min(16,Math.max(.05,Z.k*f));
  Z.x=cx-(cx-Z.x)*(nk/Z.k); Z.y=cy-(cy-Z.y)*(nk/Z.k); Z.k=nk; aplicarZoom();
}
function zoomBotao(f){ const r=canvas.getBoundingClientRect(); zoomEm(f,r.width/2,r.height/2); }
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  const r=canvas.getBoundingClientRect();
  zoomEm(e.deltaY<0?1.14:1/1.14,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

let arr=null, toques=new Map(), pinchD=0, moveu=false;
canvas.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin')) return;
  toques.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(toques.size===2){ const [a,b]=[...toques.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); arr=null; return; }
  arr={x:e.clientX,y:e.clientY,ox:Z.x,oy:Z.y}; moveu=false;
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('arrastando');
});
canvas.addEventListener('pointermove',e=>{
  if(toques.has(e.pointerId)) toques.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(toques.size===2){
    const [a,b]=[...toques.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD){ const r=canvas.getBoundingClientRect();
      zoomEm(d/pinchD,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); }
    pinchD=d; moveu=true; return;
  }
  if(!arr) return;
  const dx=e.clientX-arr.x, dy=e.clientY-arr.y;
  if(Math.abs(dx)>3||Math.abs(dy)>3) moveu=true;
  Z.x=arr.ox+dx; Z.y=arr.oy+dy; aplicarZoom();
});
function fimPointer(e){
  toques.delete(e.pointerId); if(toques.size<2) pinchD=0;
  if(arr&&!moveu&&editando) cliqueNaPlanta(e);
  arr=null; canvas.classList.remove('arrastando');
}
canvas.addEventListener('pointerup',fimPointer);
canvas.addEventListener('pointercancel',fimPointer);
function alternarFundo(){ db.ref(MAPA_REF+'/fundo').set(FUNDO==='escuro'?'claro':'escuro').catch(falha); }

/* ===================== Edição de pontos ===================== */
function alternarEdicao(){
  editando=!editando;
  const b=document.getElementById('btEdit');
  b.classList.toggle('on',editando);
  b.textContent=editando?'Concluir edição':'Editar pontos';
  canvas.classList.toggle('editando',editando);
  const av=document.getElementById('aviso');
  av.style.display=editando?'block':'none';
  atualizarAviso();
  if(editando) fecharGaveta();
  render();
}
function atualizarAviso(){
  const av=document.getElementById('aviso');
  if(!editando){ av.style.display='none'; return; }
  av.style.display='block';
  av.innerHTML=`Modo edição · <b>${pontosLista().length} ponto(s) gravados</b> — clique na planta para criar, arraste para mover, clique na bolinha para configurar`;
}
function coordsDoEvento(e){
  const r=document.getElementById('planta').getBoundingClientRect();
  return { x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),
           y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)) };
}
function cliqueNaPlanta(e){
  const r=document.getElementById('planta').getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) return;
  editarPonto(null,coordsDoEvento(e));
}
function ligarPinos(){
  document.querySelectorAll('.pin').forEach(el=>{
    const id=el.dataset.id;
    el.addEventListener('pointerdown',ev=>{
      ev.stopPropagation();
      if(!editando) return;
      let mexeu=false;
      el.setPointerCapture(ev.pointerId);
      const mv=e2=>{ const c=coordsDoEvento(e2); mexeu=true;
        el.style.left=(c.x*100)+'%'; el.style.top=(c.y*100)+'%'; };
      const up=e2=>{
        el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up);
        if(mexeu){ const c=coordsDoEvento(e2);
          db.ref(MAPA_REF+'/pontos/'+id).update({x:c.x,y:c.y}).catch(falha); }
      };
      el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
    });
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      const p=pontosLista().find(x=>x.id===id); if(!p) return;
      if(editando) editarPonto(p); else abrirGaveta(id);
    });
  });
}

/* ===================== Gaveta ===================== */
function fecharGaveta(){ pontoSel=null; document.getElementById('gav').style.display='none';
  document.querySelectorAll('.pin.sel').forEach(e=>e.classList.remove('sel')); }
function abrirGaveta(id,manter){
  const p=pontosLista().find(x=>x.id===id); if(!p){ fecharGaveta(); return; }
  pontoSel=id;
  document.querySelectorAll('.pin').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
  const S=opSetorDe(p.setor);
  const ops=(modo!=='tudo'&&!alvo)?[]:opsDoPonto(p);
  const e=estadoPonto(ops);
  document.getElementById('gav').style.display='flex';
  document.getElementById('gavT').textContent=p.nome||p.atividade||S.nome;
  document.getElementById('gavS').textContent=`${S.nome} · ${p.atividade||'todas as atividades'}`+
    (p.funcs&&p.funcs.length?` · só ${p.funcs.join(', ')}`:'');

  const c={nao:0,parcial:0,pausada:0,encerrada:0}; ops.forEach(o=>c[stOp(o)]++);
  const cor={nao:'#8d8b83',parcial:'#d4930d',pausada:'#7a6ea8',encerrada:'#2f8f46'};
  const barra=ops.length?`<div class="barras">${Object.keys(c).map(k=>c[k]?`<i style="width:${c[k]/ops.length*100}%;background:${cor[k]}"></i>`:'').join('')}</div>
    <div style="font-size:12px;color:var(--mut);font-weight:600;margin-bottom:12px">${e.fim} de ${ops.length} encerradas${e.pausadas?` · ${e.pausadas} parada(s) agora`:''}</div>`:'';

  const cards=ops.slice().sort((a,b)=>String(a.numero||'').localeCompare(String(b.numero||''))).map(o=>{
    const st=stOp(o), v=ST_OP[st], esco=escopoOP(o);
    const eq=equipeOP(o), pa=pausasDe(o), ab=pausaAberta(o);
    const trab=tempoTotalOP(o), paus=minutosPausados(o), ext=tempoExtraOP(o);
    return `<div class="op">
      <div class="op-h">
        <span class="op-n">OP ${esc(o.numero||'—')}</span>
        <span class="chip ${v.cls}">${v.label}</span>
        <span class="chip ${esco==='lote'?'c-lote':'c-proj'}">${esco==='lote'?'lote '+esc(o.lote||'—'):'só deste projeto'}</span>
      </div>
      <dl class="op-l">
        <dt>Atividade</dt><dd>${esc(o.atividade||'—')}</dd>
        <dt>Funcionário</dt><dd>${eq.length?esc(eq.join(', ')):'—'}</dd>
        <dt>Início</dt><dd>${fmtHora(o.inicio&&o.inicio.em)}</dd>
        <dt>Fim</dt><dd>${fmtHora(o.fim&&o.fim.em)}</dd>
        <dt>Tempo trabalhado</dt><dd>${st==='nao'?'—':fmtMin(trab)}${ext?` <span style="color:var(--st-and)">(${fmtMin(ext)} extra)</span>`:''}</dd>
        <dt>Tempo pausado</dt><dd>${paus?fmtMin(paus):'—'}${ab?' <b style="color:var(--st-pau)">· parada agora</b>':''}</dd>
        ${esco==='lote'?`<dt>Cobre</dt><dd>${projetosDaOP(o).length} projeto(s) do lote</dd>`:''}
      </dl>
      ${pa.length?`<div class="op-p">${pa.length} pausa(s):<br>${pa.map(x=>
        `<b>${fmtHora(x.de)}</b> → ${x.ate?fmtHora(x.ate):'em aberto'}${x.motivo?' · '+esc(x.motivo):''}`).join('<br>')}</div>`:''}
      ${o.obs?`<div class="op-p">Obs.: ${esc(o.obs)}</div>`:''}
    </div>`;
  }).join('');

  let vazioTxt='';
  if(!ops.length){
    if(modo!=='tudo'&&!alvo) vazioTxt=`Escolha um ${modo} no topo para ver o que passa por aqui.`;
    else if(modo==='projeto'&&!loteDoProjeto(alvo)&&opSetorDe(p.setor).tipo==='lote')
      vazioTxt=`O projeto <b>${esc(alvo)}</b> ainda não tem lote vinculado no Painel de Controle, então não existe OP de Sublinha para puxar. Vincule o lote e este ponto passa a acender.`;
    else vazioTxt='Nenhuma OP emitida para este ponto com o filtro atual.';
  }
  const gc=document.getElementById('gavC'), rol=gc.scrollTop;
  gc.innerHTML=barra+(ops.length?cards:`<div class="nada">${vazioTxt}</div>`);
  if(manter) gc.scrollTop=rol;
}

/* ===================== Modal e ponto ===================== */
function abrirModal(t,c,b){ document.getElementById('mT').textContent=t;
  document.getElementById('mC').innerHTML=c; document.getElementById('mB').innerHTML=b;
  document.getElementById('fundo').classList.add('on'); }
function fecharModal(){ document.getElementById('fundo').classList.remove('on'); }

let pForm=null;
function editarPonto(p,coords){
  pForm=p?{...p,funcs:(p.funcs||[]).slice()}
        :{id:novoId('pt'),nome:'',setor:'SL',atividade:'',funcs:[],x:coords.x,y:coords.y,ordem:Date.now()};
  const S=opSetorDe(pForm.setor);
  abrirModal(p?'Editar ponto':'Novo ponto',`
    <div class="cmp"><label>Nome do ponto</label>
      <input id="pfNome" value="${esc(pForm.nome)}" placeholder="Ex.: Seccionadora 1, Bancada de montagem A">
      <div class="dica">É o que aparece embaixo da bolinha na planta.</div></div>
    <div class="cmp"><label>Setor</label>
      <select id="pfSetor" onchange="mudouSetorPonto(this.value)">
        ${Object.values(OP_SETORES).map(s=>`<option value="${s.sigla}"${s.sigla===pForm.setor?' selected':''}>${s.nome}</option>`).join('')}
      </select></div>
    <div class="cmp"><label>Atividade</label>
      <select id="pfAtiv">
        <option value="">Todas as atividades do setor</option>
        ${S.atividades.map(a=>`<option value="${esc(a)}"${a===pForm.atividade?' selected':''}>${esc(a)}</option>`).join('')}
      </select>
      <div class="dica">Deixe em "todas" só se o setor inteiro ocupa uma posição única na planta.</div></div>
    <div class="cmp"><label>Funcionários deste posto (opcional)</label>
      <div class="bd" id="pfFuncs">${EQUIPE.length?EQUIPE.map(f=>
        `<label><input type="checkbox" value="${esc(f.nome)}"${pForm.funcs.includes(f.nome)?' checked':''}> ${esc(f.nome)}</label>`).join('')
        :'<div style="font-size:13px;color:var(--mut);padding:6px">Nenhum funcionário cadastrado no sistema de produção.</div>'}</div>
      <div class="dica">Use quando houver <b>duas estações da mesma atividade</b>. Sem isso as duas bolinhas acendem juntas, porque a OP não guarda posição física.</div></div>`,
    `${p?`<button class="btl per" onclick="excluirPonto('${p.id}')">Excluir</button>`:''}
     <button class="btl" onclick="fecharModal()">Cancelar</button>
     <button class="btl pri" onclick="salvarPonto()">Salvar ponto</button>`);
}
function mudouSetorPonto(sig){
  pForm.setor=sig; pForm.atividade='';
  document.getElementById('pfAtiv').innerHTML='<option value="">Todas as atividades do setor</option>'+
    opSetorDe(sig).atividades.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
}
function salvarPonto(){
  if(!pForm) return;
  pForm.nome=document.getElementById('pfNome').value.trim();
  pForm.setor=document.getElementById('pfSetor').value;
  pForm.atividade=document.getElementById('pfAtiv').value;
  pForm.funcs=[...document.querySelectorAll('#pfFuncs input:checked')].map(i=>i.value);
  if(!pForm.nome) pForm.nome=pForm.atividade||opSetorDe(pForm.setor).sigla;
  const idSalvo=pForm.id;
  db.ref(MAPA_REF+'/pontos/'+idSalvo).set({...pForm,atualizadoEm:new Date().toISOString(),atualizadoPor:usuarioAtual()})
    .then(()=>{
      fecharModal(); toast('Ponto salvo');
      setTimeout(()=>{                        // o banco aceitou, mas o ponto voltou pela leitura?
        if(!PONTOS||!PONTOS[idSalvo])
          faixaErro('<b>O ponto foi gravado, mas não volta na leitura.</b> Confira se o nó '+
            '<code>layouts</code> tem <code>".read": "auth != null"</code> nas regras do Realtime Database.');
      },2500);
    }).catch(falha);
}
function excluirPonto(id){
  if(!confirm('Excluir este ponto da planta?')) return;
  db.ref(MAPA_REF+'/pontos/'+id).remove()
    .then(()=>{ fecharModal(); if(pontoSel===id) fecharGaveta(); toast('Ponto excluído'); })
    .catch(falha);
}

/* ===================== Diagnóstico ===================== */
async function diagnostico(){
  const L=[];
  const add=(ok,t)=>L.push(`<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13.5px;font-weight:600">
    <span style="color:${ok?'#2f8f46':'#982424'};font-size:16px;line-height:1.2">${ok?'\u2714':'\u2716'}</span><span>${t}</span></div>`);
  const cod=e=>esc(String((e&&(e.code||e.message))||e));

  add(!!auth.currentUser,'Autenticado como <b>'+esc(usuarioAtual())+'</b>');

  let leu=false;
  try{
    const snap=await db.ref(MAPA_REF).once('value');
    const v=snap.val()||{};
    leu=true;
    add(true,'Leitura de <code>'+MAPA_REF+'</code> permitida — <b>'+Object.keys(v.pontos||{}).length+' ponto(s)</b> gravados no banco');
  }catch(e){ add(false,'Leitura de <code>layouts</code> NEGADA: <code>'+cod(e)+'</code>'); }

  const tid='_diag'+Date.now();
  let escreveu=false;
  try{
    await db.ref(MAPA_REF+'/pontos/'+tid).set({id:tid,nome:'teste',setor:'SL',atividade:'',x:.5,y:.5,ordem:0});
    escreveu=true; add(true,'Escrita de ponto permitida');
  }catch(e){ add(false,'Escrita de ponto NEGADA: <code>'+cod(e)+'</code>'); }

  if(escreveu){
    try{ await db.ref(MAPA_REF+'/pontos/'+tid).remove(); add(true,'Exclusão de ponto permitida'); }
    catch(e){ add(false,'Exclusão NEGADA (ponto de teste ficou no banco): <code>'+cod(e)+'</code>'); }
  }

  add(pontosLista().length>0||!leu,'Pontos carregados na tela agora: <b>'+pontosLista().length+'</b>');

  const regra='"layouts": { ".read": "auth != null", ".write": "auth != null" }';
  const conserto=(!leu||!escreveu)?`<div style="margin-top:14px;background:#fdeaea;border:1px solid rgba(152,36,36,.3);
      border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.65;color:#7f1e1e">
      <b>O banco está recusando.</b> No Console do Firebase &rarr; Realtime Database &rarr; Regras, deixe o bloco
      <code>layouts</code> exatamente assim e clique em <b>Publicar</b>:
      <div style="margin-top:8px;background:rgba(152,36,36,.09);padding:9px 11px;border-radius:7px;
      font-family:ui-monospace,monospace;font-size:12px;word-break:break-all">${esc(regra)}</div>
      Se houver <code>.validate</code> dentro de <code>layouts</code>, remova.</div>`:'';
  abrirModal('Diagnóstico do banco',L.join('')+conserto,'<button class="btl pri" onclick="fecharModal()">Fechar</button>');
}

/* ===================== Login e escuta ===================== */
function erro(m){ document.getElementById('lgErr').textContent=m||''; }
function traduz(c){
  const m={'auth/invalid-email':'E-mail inválido.','auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Usuário não encontrado.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.','auth/user-disabled':'Usuário desativado.',
    'auth/unauthorized-domain':'DOM'};
  if(m[c]==='DOM') return 'Domínio não autorizado: '+location.hostname;
  return m[c]||('Não foi possível entrar. ('+(c||'?')+')');
}
function entrar(){
  const e=(document.getElementById('em').value||'').trim(), s=document.getElementById('se').value||'';
  if(!e||!s){ erro('Preencha e-mail e senha.'); return; }
  const b=document.getElementById('lgBtn'); b.disabled=true; b.textContent='Entrando...'; erro('');
  persist.then(()=>auth.signInWithEmailAndPassword(e,s))
    .catch(x=>erro(traduz(x.code)))
    .finally(()=>{ b.disabled=false; b.textContent='Entrar'; });
}
function sair(){ if(confirm('Sair do Mapa da Fábrica?')) auth.signOut(); }
function mostrar(id){ ['login','app'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id)); }
function diag(){
  const d=document.getElementById('lgDiag');
  if(location.protocol==='file:'){ d.className='lg-d err';
    d.innerHTML='<b>Arquivo aberto direto do disco.</b>O login só funciona por https. Acesse pelo endereço publicado.';
    document.getElementById('lgBtn').disabled=true; return; }
  d.className='lg-d ok'; d.textContent='Conectado · '+location.hostname;
}
setTimeout(diag,150);

function ligar(){
  if(ligado) return; ligado=true;
  enquadrar();
  db.ref('.info/connected').on('value',s=>document.getElementById('off').classList.toggle('on',!s.val()));
  db.ref('feriados').on('value',s=>{ FERIADOS=s.val()||{}; render(); },e=>console.warn('feriados',e));
  db.ref('equipe').on('value',s=>{ EQUIPE=Object.values(s.val()||{}).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''))); },e=>console.warn('equipe',e));
  db.ref('painel').on('value',s=>{ PAINEL=Object.values(s.val()||{}); render(); },e=>console.warn('painel',e));
  db.ref('ops').on('value',s=>{ OPS=Object.values(s.val()||{}); render(); },e=>console.warn('ops',e));
  db.ref(MAPA_REF).on('value',s=>{
    faixaErro(''); const v=s.val()||{}; PONTOS=v.pontos||{}; FUNDO=v.fundo||'escuro'; render();
  },e=>{
    faixaErro('<b>Os pontos não carregam.</b> O banco negou a leitura de <code>layouts</code>. '+
      'No Console do Firebase → Realtime Database → Regras, libere: '+
      '<code>"layouts": { ".read": "auth != null", ".write": "auth != null" }</code>');
  });
}
auth.onAuthStateChanged(u=>{
  if(u){ mostrar('app'); ligar(); }
  else{ const f=document.getElementById('loginForm'); if(f) f.reset(); mostrar('login'); }
});
window.addEventListener('resize',()=>{ if(document.getElementById('app').classList.contains('on')) enquadrar(); });
setInterval(()=>{ if(document.getElementById('app').classList.contains('on')) render(); },60000);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ fecharModal(); fecharGaveta(); } });
</script>
</body>
